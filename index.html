<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>曾思遠 Giga｜把 AI Agent 放進企業的日常工作流</title>
<meta name="description" content="曾思遠 Giga：AI Agent 企業導入顧問、企業內訓講師，旋宇科技（Nautilus AI）執行長。工程師的手、交易員的腦、老師的嘴，近 20 年把複雜的東西做成別人用得起來的產品。">
<meta property="og:title" content="曾思遠 Giga｜把 AI Agent 放進企業的日常工作流">
<meta property="og:description" content="AI Agent 要進工作流，不是停在聊天視窗。2026 AI Award 最佳講者特優賞。">
<meta property="og:image" content="https://event.bymyway.com/curated/zeng-siyuan/images/og-card.webp">
<style>
:root{
  --ink:#0a1828;--navy:#10233c;--navy2:#16304f;--navy3:#1d3a5f;
  --cobalt:#1d4ed8;--cobalt2:#2563eb;--sky:#8fb4ff;--sky2:#dbe7ff;
  --paper:#f6f4ee;--paper2:#ece8db;--card:#fff;
  --gold:#e8a020;--gold2:#f2b950;--teal:#0e7c7b;
  --text:#16283f;--muted:#54687f;--line:#d8dce6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang TC",monospace;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--text);font-size:22px;line-height:1.75;overflow-x:clip;-webkit-text-size-adjust:100%}
img{max-width:100%}
a{color:var(--cobalt)}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--gold2);color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- image placeholders: anti-CLS ---------- */
.ph{position:relative;display:block;overflow:hidden;background:var(--phbg,#d8dce6)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.ph img.ld{opacity:1}
.ph.contain img{object-fit:contain}
/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:28px;padding:14px 28px;background:rgba(10,24,40,.88);backdrop-filter:blur(10px);color:#fff}
.nav .brand{font-weight:800;font-size:22px;letter-spacing:.04em;white-space:nowrap;color:#fff;text-decoration:none}
.nav .brand b{color:var(--gold2)}
.nav .links{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav .links::-webkit-scrollbar{display:none}
.nav .links a{color:#e8eef7;text-decoration:none;font-size:20px;padding:8px 14px;border-radius:99px;white-space:nowrap}
.nav .links a:hover{background:rgba(255,255,255,.12)}
.nav .links a.on{background:var(--cobalt);color:#fff}
/* ---------- section scaffolding ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
section{position:relative;padding:110px 0}
.eyebrow{font-family:var(--mono);font-size:20px;letter-spacing:.22em;color:var(--cobalt);text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.eyebrow::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(232,160,32,.22);flex:none}
.eyebrow::after{content:"";height:2px;width:64px;background:repeating-linear-gradient(90deg,var(--cobalt) 0 8px,transparent 8px 16px)}
h2.sec{font-size:clamp(36px,4.6vw,54px);line-height:1.25;letter-spacing:.01em;margin-bottom:16px}
.lead{font-size:23px;color:var(--muted);max-width:860px}
.lead b{color:var(--text)}
.sec-head{margin-bottom:52px}
/* rise-in text */
.js .rise{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(28px);transition:opacity .8s ease,clip-path .8s ease,transform .8s ease}
.js .rise.in{opacity:1;clip-path:inset(0 0 0 0);transform:none}
/* ---------- HERO : shrink frame + blueprint + workflow ---------- */
.hero-wrap{height:155vh;position:relative;background:var(--ink)}
.hero-stage{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:stretch;background:
  linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px),
  radial-gradient(1100px 600px at 82% 8%,rgba(37,99,235,.35),transparent 60%),
  radial-gradient(800px 500px at 8% 90%,rgba(232,160,32,.16),transparent 55%),
  linear-gradient(160deg,#0a1828 0%,#10233c 55%,#0d1f36 100%);
  background-size:56px 56px,56px 56px,auto,auto,auto;color:#fff}
.hero-stage .flowlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.35}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;width:100%;max-width:1240px;margin:0 auto;padding:84px 28px 24px}
.hero-eyebrow{font-family:var(--mono);font-size:20px;letter-spacing:.24em;color:var(--sky);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.hero-eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--gold2);box-shadow:0 0 14px var(--gold2);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:clamp(56px,7vw,92px);line-height:1.05;letter-spacing:.02em}
.hero h1 .en{display:block;font-family:var(--mono);font-size:clamp(20px,2.6vw,30px);letter-spacing:.42em;color:var(--gold2);margin-top:14px;font-weight:600}
.hero .tagline{font-size:clamp(24px,2.6vw,30px);line-height:1.5;margin:22px 0 12px;font-weight:700;text-wrap:balance}
.hero .tagline em{font-style:normal;color:var(--gold2)}
.hero .intro{font-size:22px;color:#c7d4e6;max-width:560px}
.hero .roles{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}
.hero .roles span{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 16px;font-size:20px;color:#eef3fa;background:rgba(255,255,255,.06)}
.hero .roles span.hot{border-color:var(--gold2);color:var(--gold2)}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:21px;font-weight:700;border-radius:99px;padding:14px 28px;border:2px solid transparent;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#231600;box-shadow:0 8px 24px rgba(232,160,32,.35)}
.btn-gold:hover{box-shadow:0 12px 30px rgba(232,160,32,.5)}
.btn-line{border-color:rgba(255,255,255,.6);color:#fff}
.btn-line:hover{background:rgba(255,255,255,.1)}
.btn-blue{background:var(--cobalt);color:#fff}
.btn-blue:hover{background:var(--cobalt2)}
/* portrait panel */
.portrait-panel{position:relative;height:min(58vh,540px);border-radius:28px;overflow:visible}
.portrait-panel .panel-bg{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2b5cb8 0%,#16305a 55%,#0e2242 100%);box-shadow:0 30px 60px rgba(0,0,0,.45);border:1px solid rgba(143,180,255,.35)}
.portrait-panel .panel-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(143,180,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(143,180,255,.14) 1px,transparent 1px);background-size:44px 44px}
.portrait-panel .panel-bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,rgba(6,14,26,.55))}
.portrait-panel .vf{position:absolute;inset:0;z-index:2}
.portrait-panel .vf img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:97%;width:auto;max-width:106%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.4))}
.portrait-panel .vf.blur img{filter:blur(22px);transform:translateX(-50%) scale(1.04)}
.portrait-panel .vf.sharpen img{transition:filter 2.4s ease,transform 2.4s ease;filter:blur(0);transform:translateX(-50%) scale(1)}
.portrait-panel .skip-vf{position:absolute;z-index:5;right:14px;top:14px;background:rgba(10,24,40,.75);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 18px;font-size:20px}
.node-chip{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;background:rgba(10,24,40,.82);border:1px solid rgba(143,180,255,.5);color:#eaf1ff;border-radius:99px;padding:8px 16px;font-size:20px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.node-chip i{width:9px;height:9px;border-radius:50%;background:var(--gold2);flex:none;box-shadow:0 0 10px var(--gold2)}
.node-chip small{font-family:var(--mono);font-size:20px;color:var(--sky);letter-spacing:.08em}
.chip-a{left:-24px;top:16%}
.chip-b{right:-18px;top:38%}
.chip-c{left:-14px;bottom:22%}
.chip-d{right:-8px;bottom:8%}
.portrait-cap{position:absolute;z-index:4;left:18px;bottom:16px;font-size:20px;color:#dbe7ff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
/* hero workflow strip */
.flow-strip{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:0 28px 24px;width:100%}
.flow-strip .track{border:1px solid rgba(143,180,255,.35);border-radius:20px;background:rgba(10,24,40,.55);backdrop-filter:blur(6px);padding:20px 28px;display:flex;align-items:center;gap:0;flex-wrap:wrap}
.flow-strip .lbl{font-family:var(--mono);font-size:20px;letter-spacing:.18em;color:var(--sky);margin-right:22px;white-space:nowrap}
.flow-node{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;color:#fff;white-space:nowrap}
.flow-node .dot{width:38px;height:38px;border-radius:50%;background:var(--cobalt);border:2px solid var(--sky);display:grid;place-items:center;font-family:var(--mono);font-size:20px;flex:none}
.flow-node:last-child .dot{background:var(--gold);border-color:var(--gold2);color:#231600}
.flow-arrow{flex:1;min-width:34px;height:2px;margin:0 14px;background:repeating-linear-gradient(90deg,var(--sky) 0 8px,transparent 8px 16px);position:relative;animation:dashmove 1.1s linear infinite}
.flow-arrow::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left-color:var(--sky)}
@keyframes dashmove{to{background-position:16px 0}}
.scroll-hint{position:absolute;z-index:3;left:50%;bottom:118px;transform:translateX(-50%);font-size:20px;color:#9db4d4;letter-spacing:.3em;display:none}
/* ---------- STATS pipeline ---------- */
#stats{background:var(--paper);overflow:hidden}
#statsCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.pipe{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;margin-top:8px}
.pipe::before{content:"";position:absolute;left:6%;right:6%;top:44px;height:3px;background:repeating-linear-gradient(90deg,var(--cobalt) 0 12px,transparent 12px 24px);opacity:.55;animation:dashmove 1.4s linear infinite}
.stat{position:relative;text-align:center;padding:0 18px}
.stat .node-dot{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--cobalt);margin:32px auto 18px;position:relative;z-index:2;box-shadow:0 0 0 8px var(--paper)}
.stat .num{display:flex;justify-content:center;align-items:flex-end;gap:6px;min-height:96px}
.stat .num .pre,.stat .num .unit{font-size:30px;font-weight:800;color:var(--cobalt);padding-bottom:14px}
.stat .lbl2{font-size:23px;font-weight:800;margin-top:6px}
.stat .sub{font-size:20px;color:var(--muted);line-height:1.6;margin-top:6px}
/* wheel digits */
.wheel{display:inline-flex;overflow:hidden;height:96px}
.wheel-col{position:relative;width:.62em;font-size:88px;line-height:96px;font-weight:800;color:var(--cobalt);font-variant-numeric:tabular-nums;text-align:center}
.wheel-strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.wheel-strip span{display:block;height:96px}
.js .wheel-strip{transform:translateY(0)}
.js .wheel-col.running .wheel-strip{transition:transform 1s cubic-bezier(.16,1,.3,1);transform:translateY(calc(var(--end) * -96px))}
.wheel-col.final .wheel-strip{transform:translateY(calc(var(--end) * -96px))}
/* ---------- BIO : three tracks ---------- */
#bio{background:linear-gradient(var(--paper),var(--paper2))}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:8px}
.track-card{border-radius:20px;padding:26px 26px 22px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
.track-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tc)}
.track-card h3{font-size:26px;display:flex;align-items:center;gap:10px}
.track-card h3 .tk{font-family:var(--mono);font-size:20px;letter-spacing:.14em;color:#fff;background:var(--tc);border-radius:6px;padding:3px 9px}
.track-card p{font-size:21px;color:var(--muted);margin-top:8px;line-height:1.65}
.merge-svg{display:block;width:100%;height:auto;margin:6px 0 4px}
.merge-note{text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.14em;color:var(--cobalt);margin-bottom:44px}
.moments{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:56px}
.moment{border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px rgba(16,35,60,.08)}
.moment .ph{aspect-ratio:4/3}
.moment .ph img{object-position:center 30%}
.moment figcaption{padding:16px 20px 18px;font-size:21px;line-height:1.6}
.moment figcaption b{display:block;font-size:22px}
.moment figcaption span{color:var(--muted);font-size:20px}
.bio-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.bio-col{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 24px;border-top:6px solid var(--bc,#1d4ed8)}
.bio-col h3{font-size:25px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.bio-col h3 i{width:12px;height:12px;border-radius:50%;background:var(--bc,#1d4ed8);flex:none}
.bio-col ul{list-style:none}
.bio-col li{font-size:21px;line-height:1.65;padding:9px 0;border-top:1px dashed var(--line)}
.bio-col li:first-child{border-top:0}
.bio-col li b{color:var(--cobalt)}
.bio-col li .yr{font-family:var(--mono);font-size:20px;color:var(--gold);font-weight:700;margin-right:8px;letter-spacing:.04em}
blockquote.bigquote{margin:64px auto 0;max-width:920px;text-align:center;position:relative;padding:20px 30px}
blockquote.bigquote::before{content:"“";position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:120px;line-height:1;color:var(--gold);opacity:.5;font-family:serif}
blockquote.bigquote p{font-size:clamp(30px,3.6vw,42px);font-weight:800;line-height:1.45}
blockquote.bigquote footer{margin-top:16px;font-size:20px;color:var(--muted)}
/* ---------- EXPERTISE ---------- */
#expertise{background:var(--ink);color:#eaf1ff}
#expertise .eyebrow{color:var(--sky)}
#expertise .lead{color:#b9c9de}
#expertise .lead b{color:#fff}
.hotspot-wrap{border-radius:24px;overflow:hidden;border:1px solid rgba(143,180,255,.35);background:#0d2038;box-shadow:0 24px 50px rgba(0,0,0,.4)}
.hotspot-fig{position:relative}
.hotspot-fig .ph{aspect-ratio:16/9}
.hotspot-fig img{object-position:center 38%}
.hotspot{position:absolute;z-index:3;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--gold);color:#231600;font-size:22px;font-weight:800;display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 4px 16px rgba(0,0,0,.5);transition:transform .2s ease,background .2s ease}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.12)}
.hotspot.on{background:#fff;color:var(--cobalt);transform:translate(-50%,-50%) scale(1.15);box-shadow:0 0 0 6px rgba(232,160,32,.45),0 4px 16px rgba(0,0,0,.5)}
.hotspot-fig .fig-cap{position:absolute;left:0;right:0;bottom:0;padding:34px 22px 14px;font-size:20px;color:#fff;background:linear-gradient(transparent,rgba(6,14,26,.78));z-index:2;pointer-events:none}
.hotspot-panel{position:relative;padding:26px 30px 30px;border-top:1px solid rgba(143,180,255,.3)}
.hotspot-panel .laser{position:absolute;top:-1px;width:2px;height:0;background:linear-gradient(var(--gold2),transparent);transition:left .35s ease;z-index:1}
.hotspot-panel h3{font-size:27px;margin-bottom:8px}
.hotspot-panel h3 .no{font-family:var(--mono);color:var(--gold2);margin-right:10px}
.hotspot-panel p{font-size:22px;color:#c7d4e6;line-height:1.7;max-width:900px}
.hotspot-nav{display:flex;gap:12px;margin-top:18px}
.hotspot-nav button{background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:9px 22px;font-size:20px}
.hotspot-nav button:hover{border-color:#fff}
.exp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px}
.exp-card{background:#10233c;border:1px solid rgba(143,180,255,.3);border-radius:20px;overflow:hidden;position:relative}
.exp-card::before,.exp-card::after{content:"";position:absolute;top:14px;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid var(--sky);z-index:2}
.exp-card::before{left:14px}.exp-card::after{right:14px}
.exp-card .ph{aspect-ratio:4/3}
.exp-card .body{padding:20px 22px 24px}
.exp-card .tagchip{display:inline-block;font-family:var(--mono);font-size:20px;letter-spacing:.1em;color:var(--gold2);border:1px solid rgba(242,185,80,.5);border-radius:99px;padding:4px 14px;margin-bottom:10px}
.exp-card h3{font-size:25px;line-height:1.4;margin-bottom:8px}
.exp-card p{font-size:21px;color:#b9c9de;line-height:1.65}
/* products system map */
.sysmap{margin-top:64px}
.sysmap h3{font-size:30px;text-align:center;margin-bottom:6px}
.sysmap .sys-sub{text-align:center;color:#b9c9de;font-size:21px;margin-bottom:30px}
.sys-bus{position:relative;height:3px;background:repeating-linear-gradient(90deg,var(--sky) 0 10px,transparent 10px 20px);opacity:.7;margin:0 12.5% 0}
.sys-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--gold);color:#231600;font-weight:800;font-size:21px;border-radius:99px;padding:9px 24px;white-space:nowrap;box-shadow:0 8px 22px rgba(232,160,32,.4)}
.sys-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}
.sys-card{position:relative;background:#10233c;border:1px solid rgba(143,180,255,.3);border-radius:18px;padding:24px 22px;text-decoration:none;color:#eaf1ff;display:block;transition:border-color .2s ease,transform .2s ease}
.sys-card:hover{border-color:var(--gold2);transform:translateY(-3px)}
.sys-card::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;background:var(--sky);opacity:.7}
.sys-card::after{content:"";position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--sky)}
.sys-card h4{font-size:24px;margin-bottom:6px}
.sys-card h4 span{font-family:var(--mono);font-size:20px;color:var(--sky);display:block;letter-spacing:.06em;margin-top:2px}
.sys-card p{font-size:20px;color:#b9c9de;line-height:1.6}
.sys-card .go{margin-top:12px;font-size:20px;color:var(--gold2);font-weight:700}
.courses{margin-top:56px;border:1px solid rgba(143,180,255,.3);border-radius:20px;padding:28px 30px;background:rgba(255,255,255,.03)}
.courses h3{font-size:27px;margin-bottom:12px}
.courses p{font-size:21px;color:#c7d4e6;line-height:1.7}
.courses .mods{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.courses .mods span{border:1px solid rgba(143,180,255,.5);border-radius:99px;padding:7px 16px;font-size:20px;color:#eaf1ff}
.courses .links{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}

/* ---------- STORY : flow timeline ---------- */
#story{background:var(--paper)}
.timeline{position:relative;max-width:980px;margin:0 auto}
.timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--cobalt) 0 12px,transparent 12px 24px);opacity:.5}
.station{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding:34px 0}
.station .node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--cobalt);z-index:2;box-shadow:0 0 0 8px var(--paper)}
.station:nth-child(even) .st-text{order:2}
.station:nth-child(even) .st-media{order:1}
.station:nth-child(even) .node{border-color:var(--gold)}
.st-year{font-family:var(--mono);font-size:20px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.st-text h3{font-size:30px;line-height:1.4;margin:8px 0 10px}

function wheelHTML(digits, statIdx) {

<script>
(function () {
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const sineInOut = t => .5 - .5 * Math.cos(t * Math.PI);

  /* ---------- ⑭ wall aspect ratios (true ratios, anti-CLS) ---------- */
  const RATIOS = {
    "stage-head.webp": "1000/563", "auditorium.webp": "1000/667", "award.webp": "600/800",
    "eimba.webp": "4/3", "cpc.webp": "4/3", "aia-talk.webp": "4/3", "workshop.webp": "4/3",
    "dotdot-work.webp": "1000/568", "whiteboard.webp": "1000/645", "teaching.webp": "3/4",
    "surface.webp": "1000/698", "apaba.webp": "1000/834", "tbb.webp": "4/3",
    "aia-group.webp": "4/3", "classroom.webp": "4/3", "central-bank.webp": "3/4", "og-card.webp": "1000/525"
  };
  $$("#wall .ph").forEach(phEl => {
    const img = phEl.querySelector("img");
    const key = img.getAttribute("src").split("/").pop();
    if (RATIOS[key]) phEl.style.aspectRatio = RATIOS[key];
  });

  /* ---------- ⑬ viewfinder intro ---------- */
  const vf = $("#vfBox"), skipBtn = $("#skipVf");
  function vfDone() {
    vf.classList.remove("blur", "sharpen");
    if (skipBtn) skipBtn.style.display = "none";
    try { sessionStorage.setItem("giga-vf", "1"); } catch (e) {}
  }
  let vfSeen = false;
  try { vfSeen = !!sessionStorage.getItem("giga-vf"); } catch (e) {}
  if (RM || vfSeen) { vfDone(); }
  else {
    setTimeout(() => { vf.classList.add("sharpen"); }, 350);
    setTimeout(vfDone, 3000);
    if (skipBtn) skipBtn.addEventListener("click", vfDone);
  }

  /* ---------- ⑧ scroll shrink-frame (desktop) ---------- */
  const stage = $("#heroStage");
  const shrinkOK = matchMedia("(min-width: 641px)").matches && !RM;
  let curP = 0, tgtP = 0;
  function shrinkTick() {
    const max = innerHeight * 0.55;
    tgtP = clamp(scrollY / max, 0, 1);
    curP += (tgtP - curP) * 0.18;
    const e = sineInOut(curP);
    const inset = 10 * e, rad = 18 * e, sc = 1 - 0.06 * e;
    stage.style.clipPath = "inset(" + inset.toFixed(2) + "px round " + rad.toFixed(2) + "px)";
    stage.style.transform = "scale(" + sc.toFixed(4) + ")";
    requestAnimationFrame(shrinkTick);
  }
  if (shrinkOK) requestAnimationFrame(shrinkTick);

  /* ---------- ⑪ rise-in ---------- */
  const riseIO = new IntersectionObserver(es => {
    es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); riseIO.unobserve(en.target); } });
  }, { threshold: 0, rootMargin: "0px 0px -8% 0px" });
  $$(".rise").forEach(el => riseIO.observe(el));

  /* ---------- ⑨ wheel numbers ---------- */
  const wheelIO = new IntersectionObserver(es => {
    es.forEach(en => {
      if (!en.isIntersecting) return;
      wheelIO.unobserve(en.target);
      if (RM) return;
      en.target.querySelectorAll(".wheel-col").forEach(col => {
        col.classList.remove("final");
        const strip = col.querySelector(".wheel-strip");
        strip.style.transitionDelay = ((+col.dataset.stat) * 70 + (+col.dataset.pos) * 45) + "ms";
        requestAnimationFrame(() => requestAnimationFrame(() => col.classList.add("running")));
      });
    });
  }, { threshold: 0.4 });
  $$(".stat").forEach(el => wheelIO.observe(el));

  /* ---------- ③ count-up ---------- */
  const countIO = new IntersectionObserver(es => {
    es.forEach(en => {
      if (!en.isIntersecting) return;
      countIO.unobserve(en.target);
      if (RM) return;
      const el = en.target, target = +el.dataset.count, t0 = performance.now();
      (function step(now) {
        const p = clamp((now - t0) / 1200, 0, 1);
        el.textContent = Math.round(easeOutCubic(p) * target);
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }, { threshold: 0.35 });
  $$("[data-count]").forEach(el => countIO.observe(el));

  /* ---------- ⑦ particle wave ---------- */
  const cv = $("#statsCanvas");
  if (cv && !RM) {
    const ctx = cv.getContext("2d");
    let W = 0, H = 0, mx = 0.5, my = 0.5, running = false, t = 0;
    function sizeCv() {
      const r = cv.parentElement.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    sizeCv();
    addEventListener("resize", sizeCv);
    addEventListener("pointermove", e => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; }, { passive: true });
    function draw() {
      if (!running) return;
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      const cols = innerWidth < 641 ? 26 : 50, rows = Math.max(8, Math.round(cols * H / W));
      const ox = (mx - 0.5) * W * 0.05, oy = (my - 0.5) * H * 0.05;
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const x = (i + 0.5) / cols * W + ox, y = (j + 0.5) / rows * H + oy;
          const w = Math.sin(i * 0.32 + t) + Math.sin(j * 0.3 + t * 0.8);
          const a = 0.10 + 0.12 * ((w + 2) / 4);
          ctx.fillStyle = "rgba(29,78,216," + a.toFixed(3) + ")";
          const r = 1.4 + ((w + 2) / 4) * 1.6;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
        }
      }
      requestAnimationFrame(draw);
    }
    new IntersectionObserver(es => {
      const vis = es[0].isIntersecting;
      if (vis && !running) { running = true; requestAnimationFrame(draw); }
      if (!vis) running = false;
    }, { threshold: 0 }).observe($("#stats"));
  }

  /* ---------- ⑩ marquee speed ---------- */
  const mq = $("#mq");
  function mqSpeed() {
    const chunk = mq.querySelector(".mq-chunk");
    if (!chunk) return;
    const w = chunk.getBoundingClientRect().width;
    mq.querySelector(".mq-track").style.setProperty("--mqdur", (w / 55).toFixed(2) + "s");
  }
  mqSpeed();
  addEventListener("resize", mqSpeed);
  new IntersectionObserver(es => {
    if (es[0].isIntersecting) mq.classList.add("inview");
  }, { threshold: 0.2 }).observe(mq);

  /* ---------- ④ hotspots ---------- */
  const hsFig = $("#hsFig"), hsLaser = $("#hsLaser");
  let hsIdx = 0;
  function setHs(i) {
    hsIdx = (i + DATA.hotspots.length) % DATA.hotspots.length;
    const h = DATA.hotspots[hsIdx];
    $$(".hotspot").forEach((d, k) => d.classList.toggle("on", k === hsIdx));
    $("#hsTitle").textContent = h.t;
    $("#hsText").textContent = h.p;
    $(".hotspot-panel .no").textContent = String(hsIdx + 1).padStart(2, "0");
    const r = hsFig.getBoundingClientRect();
    const top = r.height * h.y / 100;
    hsLaser.style.left = "calc(" + h.x + "% - 1px)";
    hsLaser.style.top = top + "px";
    hsLaser.style.height = Math.max(0, r.height - top + 2) + "px";
  }
  $$(".hotspot").forEach(d => d.addEventListener("click", () => setHs(+d.dataset.hs)));
  $("#hsPrev").addEventListener("click", () => setHs(hsIdx - 1));
  $("#hsNext").addEventListener("click", () => setHs(hsIdx + 1));
  addEventListener("resize", () => setHs(hsIdx));
  addEventListener("load", () => setHs(0));
  setHs(0);

  /* ---------- photos: filter + lightbox ---------- */
  const wall = $("#wall");
  $$(".filters button").forEach(b => b.addEventListener("click", () => {
    $$(".filters button").forEach(x => x.classList.toggle("on", x === b));
    const f = b.dataset.filter;
    $$("#wall figure").forEach(fig => fig.classList.toggle("hide", f !== "全部" && fig.dataset.cat !== f));
  }));
  const lb = $("#lightbox"), lbImg = $("#lbImg"), lbCap = $("#lbCap");
  let lbList = [], lbIdx = 0;
  function visibleFigs() { return $$("#wall figure:not(.hide)"); }
  function lbShow(i) {
    lbList = visibleFigs();
    lbIdx = (i + lbList.length) % lbList.length;
    const fig = lbList[lbIdx];
    const img = fig.querySelector("img");
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lbCap.textContent = fig.querySelector("figcaption").textContent.trim();
  }
  function lbOpen(fig) {
    lbList = visibleFigs();
    lbShow(lbList.indexOf(fig));
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function lbCloseFn() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
  }
  wall.addEventListener("click", e => {
    const fig = e.target.closest("figure");
    if (fig) lbOpen(fig);
  });
  wall.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("figure")) { e.preventDefault(); lbOpen(e.target); }
  });
  $("#lbClose").addEventListener("click", lbCloseFn);
  $("#lbPrev").addEventListener("click", e => { e.stopPropagation(); lbShow(lbIdx - 1); });
  $("#lbNext").addEventListener("click", e => { e.stopPropagation(); lbShow(lbIdx + 1); });
  lb.addEventListener("click", e => { if (e.target === lb) lbCloseFn(); });

  /* ---------- spy + pen mode (⑤) ---------- */
  const stations = [
    { id: "top", name: "開場" }, { id: "stats", name: "數字" }, { id: "bio", name: "學經歷" },
    { id: "expertise", name: "專長" }, { id: "story", name: "走過的路" }, { id: "sharing", name: "免費分享" },
    { id: "media", name: "媒體牆" }, { id: "photos", name: "照片牆" }, { id: "contact", name: "聯絡" }
  ];
  let curStation = 0, scrolling = false;
  const penLabel = $("#penLabel");
  function setStation(i) {
    curStation = clamp(i, 0, stations.length - 1);
    penLabel.innerHTML = "第 <b>" + (curStation + 1) + "</b> / " + stations.length + " 站・" + stations[curStation].name;
    $("#penPrev").disabled = curStation === 0;
    $("#penNext").disabled = curStation === stations.length - 1 && hsIdx === DATA.hotspots.length - 1;
    $$("#navLinks a").forEach(a => a.classList.toggle("on", a.dataset.spy === stations[curStation].id));
  }
  function spy() {
    if (scrolling) return;
    const y = scrollY + 140;
    let idx = 0;
    stations.forEach((s, i) => {
      const el = document.getElementById(s.id);
      if (el && el.getBoundingClientRect().top + scrollY <= y) idx = i;
    });
    if (scrollY + innerHeight >= document.body.scrollHeight - 4) idx = stations.length - 1;
    setStation(idx);
  }
  let spyTick = false;
  addEventListener("scroll", () => {
    if (!spyTick) { spyTick = true; requestAnimationFrame(() => { spy(); spyTick = false; }); }
  }, { passive: true });
  function animScrollTo(targetY, done) {
    const startY = scrollY, dist = targetY - startY;
    const dur = clamp(Math.abs(dist) * 0.9, 600, 1600);
    const t0 = performance.now();
    scrolling = true;
    (function step(now) {
      const p = clamp((now - t0) / dur, 0, 1);
      scrollTo(0, startY + dist * easeInOutCubic(p));
      if (p < 1) requestAnimationFrame(step);
      else { scrolling = false; if (done) done(); }
    })(t0);
  }
  function goStation(i) {
    const el = document.getElementById(stations[clamp(i, 0, stations.length - 1)].id);
    if (!el) return;
    const y = el.getBoundingClientRect().top + scrollY - (stations[i].id === "top" ? 0 : 64);
    animScrollTo(Math.max(0, y), () => setStation(i));
    setStation(i);
  }
  function penNext() {
    if (stations[curStation].id === "expertise" && hsIdx < DATA.hotspots.length - 1) {
      setHs(hsIdx + 1);
      const r = hsFig.getBoundingClientRect();
      if (r.top < 60 || r.bottom > innerHeight - 40) animScrollTo(scrollY + r.top - 90);
      return;
    }
    if (curStation < stations.length - 1) goStation(curStation + 1);
  }
  function penPrev() {
    if (stations[curStation].id === "expertise" && hsIdx > 0) { setHs(hsIdx - 1); return; }
    if (curStation > 0) goStation(curStation - 1);
  }
  $("#penNext").addEventListener("click", penNext);
  $("#penPrev").addEventListener("click", penPrev);
  addEventListener("keydown", e => {
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") lbCloseFn();
      if (e.key === "ArrowLeft") lbShow(lbIdx - 1);
      if (e.key === "ArrowRight") lbShow(lbIdx + 1);
      return;
    }
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "ArrowDown" || e.key === "PageDown" || (e.key === " " && tag === "body")) { e.preventDefault(); penNext(); }
    if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); penPrev(); }
  });

  /* ---------- ⑫ curtain transition for nav ---------- */
  const curtain = $("#curtain");
  let curtainBusy = false;
  $$(".nav a[href^='#']").forEach(a => a.addEventListener("click", e => {
    const id = a.getAttribute("href").slice(1);
    const el = document.getElementById(id);
    if (!el || RM || curtainBusy) return;
    e.preventDefault();
    curtainBusy = true;
    const bez = "cubic-bezier(.645,.045,.355,1)";
    curtain.animate(
      [{ transform: "scaleY(0)", transformOrigin: "top" }, { transform: "scaleY(1)", transformOrigin: "top" }],
      { duration: 460, easing: bez, fill: "forwards" }
    ).finished.then(() => {
      scrollTo(0, Math.max(0, el.getBoundingClientRect().top + scrollY - (id === "top" ? 0 : 64)));
      const idx = stations.findIndex(s => s.id === id);
      if (idx >= 0) setStation(idx);
      return curtain.animate(
        [{ transform: "scaleY(1)", transformOrigin: "bottom" }, { transform: "scaleY(0)", transformOrigin: "bottom" }],
        { duration: 500, easing: bez, fill: "forwards" }
      ).finished;
    }).then(() => { curtainBusy = false; }).catch(() => { curtainBusy = false; });
  }));

  setStation(0);
  spy();
})();
</script>
</body>
